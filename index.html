<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Best Books - Dina El Sawy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial}
body{background:#000;color:#fff;overflow-x:hidden}
.top{padding:22px 18px 0;display:flex;justify-content:space-between;align-items:flex-start}
.top h1{font-size:32px;font-weight:900;line-height:1}
.top p{font-size:13px;color:#8A7A60;margin-top:4px}
.bag{width:44px;height:44px;background:#111;border:1px solid #333;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;font-size:18px;cursor:pointer}
.bag b{position:absolute;top:-6px;right:-6px;background:#1F4D3A;color:#fff;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.search{margin:14px 18px;background:#111;border:1px solid #333;padding:13px 14px;border-radius:14px;color:#aaa;font-size:13px;display:flex;gap:8px;align-items:center}
.search input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px}
.search input::placeholder{color:#8A7A60}
.pills{display:flex;gap:8px;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{white-space:nowrap;padding:9px 15px;border-radius:20px;border:1px solid #333;background:#111;font-weight:700;font-size:13px;color:#fff;cursor:pointer}
.pills button.on{background:#fff;color:#000;border-color:#fff}
.head{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:center}
.head h2{font-size:19px}
.head span{font-size:11px;color:#8A7A60}
.stage{position:relative;padding:0 18px;margin-top:14px}
.shelf{display:flex;gap:12px;padding:6px 2px 0;overflow-x:auto;scrollbar-width:none;position:relative;z-index:2}
.shelf::-webkit-scrollbar{display:none}
.book{flex:0 0 118px;height:158px;border-radius:4px 8px 8px 4px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:5px 6px 14px rgba(0,0,0,.5);position:relative;user-select:none}
.book small{font-size:9px;letter-spacing:.5px;opacity:.85}
.book b{font-size:14px;line-height:1.3}
.book .foot{display:flex;justify-content:space-between;align-items:end}
.book .auth{font-size:10px;opacity:.9;line-height:1.2}
.book .ico{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;color:#fff}
.b1{background:#2B4A6E;color:#fff} .b2{background:#F2E5C3;color:#3A2A10} .b3{background:#7A4630;color:#fff} .b4{background:#A63B3B;color:#fff} .b5{background:#1F5A4A;color:#fff} .b6{background:#5B2A7B;color:#fff}
.wood{height:13px;background:linear-gradient(#D2AC7E,#B98A5E,#8A5A2E);border-radius:2px;box-shadow:0 5px 10px rgba(0,0,0,.5);margin-top:-1px}
.detail{padding:16px 18px 0}
.detailTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.detailTop h3{font-size:22px;line-height:1.2}
.detailTop p{font-size:12px;color:#9A8B6F;margin-top:4px}
.price{font-size:20px;font-weight:900;white-space:nowrap}
.toggle{display:flex;gap:8px;margin:14px 0}
.toggle button{flex:1;padding:12px;border-radius:12px;border:1px solid #333;background:#111;font-weight:800;font-size:13px;color:#fff;cursor:pointer}
.toggle button.on{background:#fff;color:#000}
.lbl{font-size:12px;color:#9A8B6F;margin:6px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:7px 12px;border-radius:20px;border:1px solid #333;background:#111;font-size:12px;color:#fff;cursor:pointer}
.chips button.on{background:#fff;color:#000}
.add{width:100%;margin-top:14px;padding:15px;background:#1E4D3A;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer}
.add.done{background:#2E7D5B}
.best{padding:20px 18px 0}
.best h2{font-size:17px;margin-bottom:12px}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 132px;background:#111;border:1px solid #333;border-radius:14px;padding:10px;cursor:pointer}
.card .cover{height:108px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;font-weight:800;line-height:1.3}
.card b{font-size:13px;display:block;margin-top:8px;line-height:1.3}
.card small{font-size:11px;color:#9A8B6F}
.footer{text-align:center;padding:28px 18px 20px}
.sign{font-size:46px;font-family:'Brush Script MT',cursive;color:#FFD700;transform:rotate(-3deg);line-height:1}
.footer p{font-size:12px;color:#9A8B6F;margin-top:6px}
.empty{text-align:center;padding:30px 10px;color:#888;font-size:13px}
</style>
</head>
<body>
<div class="top"><div><h1>Best Books</h1><p>مكتبة الوعي والنمو</p></div><div class="bag" onclick="showBag()">🛍️<b id="bagCount">0</b></div></div>
<div class="search">🔍 <input id="searchInput" placeholder="Search - ، سمية الناصر، سناء زيادة..." oninput="doSearch(this.value)"></div>
<div class="pills" id="pills">
<button class="on" onclick="setFilter('all',this)">All Books</button>
<button onclick="setFilter('سمية الناصر',this)">سمية الناصر</button>
<button onclick="setFilter('سناء زيادة',this)">سناء زيادة</button>
<button onclick="setFilter('وعي',this)">وعي</button>
<button onclick="setFilter('تنمية',this)">تنمية</button>
</div>

<div class="head"><h2>New on the ledge</h2><span>Pull down to refresh</span></div>
<div class="stage"><div class="shelf" id="shelf"></div><div class="wood"></div></div>

<div class="detail">
<div class="detailTop"><div><h3 id="t">حدثني فقال</h3><p id="a">By سمية الناصر - 312 pages</p></div><div class="price" id="p">E£ 280</div></div>
<div class="toggle"><button class="on" id="bP" onclick="setType('paper')">Paperback</button><button id="bH" onclick="setType('hard')">Hardcover</button></div>
<div class="lbl">Add animation</div>
<div class="chips"><button class="on" onclick="chip(this)">✦ 3D Flight</button><button onclick="chip(this)">📦 Cardboard Box</button><button onclick="chip(this)">Shelf Reveal</button><button onclick="chip(this)">🎀 Ribbon Snap</button></div>
<button class="add" id="addBtn" onclick="addBag()">Add to bag - E£ <span id="ap">280</span></button>
</div>

<div class="best"><h2>Best Sellers - الأكثر مبيعاً</h2><div class="row" id="row"></div></div>
<div class="footer"><div class="sign">dinaalssawy ✍️</div><p>Best Books all rightsreserved ♾ 2026 created by </p></div>

<script>
const allBooks=[
{t:"حدثني فقال",a:"سمية الناصر",p:280,c:"b1",i:"🌙",cat:"وعي"},
{t:"كيف تتقن لعبة الحياة",a:"سمية الناصر",p:320,c:"b2",i:"♦️",cat:"تنمية"},
{t:"حدثني فقال 2",a:"سمية الناصر",p:300,c:"b3",i:"✦",cat:"وعي"},
{t:"الشفرة الكاملة للثروة",a:"سناء زيادة",p:450,c:"b4",i:"△",cat:"تنمية"},
{t:"صناعة الواقع",a:"سناء زيادة",p:400,c:"b5",i:"◉",cat:"وعي"},
{t:"لا تقلق",a:"سمية الناصر",p:260,c:"b6",i:"●",cat:"وعي"},
{t:"ماذا فعلت؟",a:"سمية الناصر",p:250,c:"b4",i:"✦",cat:"تنمية"},
{t:"بناء الفكر الريادي",a:"سناء زيادة",p:380,c:"b2",i:"♦️",cat:"تنمية"},
];
let cur=allBooks[0], type='paper', bag=0, price=280, currentFilter='all', currentSearch='';
function getFiltered(){
  return allBooks.filter(b=>{
    let okFilter = currentFilter==='all' || b.a.includes(currentFilter) || b.cat===currentFilter;
    let okSearch = !currentSearch || (b.t+b.a+b.cat).includes(currentSearch);
    return okFilter && okSearch;
  });
}
function render(){
 const list = getFiltered();
 const s=document.getElementById('shelf'); s.innerHTML='';
 const r=document.getElementById('row'); r.innerHTML='';
 if(list.length===0){
   s.innerHTML='<div class="empty">جرب كلمة تانية</div>';
   return;
 }
 list.forEach(b=>{
  const d=document.createElement('div'); d.className='book '+b.c;
  d.innerHTML=`<small>BEST BOOKS</small><b>${b.t}</b><div class="foot"><span class="auth">${b.a}</span><span class="ico">${b.i}</span></div>`;
  d.onclick=()=>select(b);
  s.appendChild(d);
  const m=document.createElement('div'); m.className='card';
  m.innerHTML=`<div class="cover ${b.c}">${b.t}</div><b>${b.t}</b><small>${b.a} - E£ ${b.p}</small>`;
  m.onclick=()=>select(b); r.appendChild(m);
 });
}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('#pills button').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function doSearch(v){
  currentSearch=v.trim();
  render();
}
function select(b){ cur=b; price = type==='paper'? b.p : b.p+140; document.getElementById('t').innerText=b.t; document.getElementById('a').innerText=`By ${b.a} - 312 pages`; document.getElementById('p').innerText=`E£ ${price}`; document.getElementById('ap').innerText=price; const btn=document.getElementById('addBtn'); btn.classList.remove('done'); btn.innerHTML=`Add to bag - E£ ${price}`; window.scrollTo({top:document.querySelector('.detail').offsetTop-10,behavior:'smooth'}); }
function setType(t){ type=t; document.getElementById('bP').classList.toggle('on',t==='paper'); document.getElementById('bH').classList.toggle('on',t==='hard'); select(cur); }
function chip(btn){ document.querySelectorAll('.chips button').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); }
function addBag(){ bag++; document.getElementById('bagCount').innerText=bag; const btn=document.getElementById('addBtn'); btn.classList.add('done'); btn.innerText=`✓ In your bag, ${type==='paper'?'paperback':'hardcover'}`; setTimeout(()=>{btn.classList.remove('done'); btn.innerText=`Add to bag - E£ ${price}`},2200); }
function showBag(){ alert('الحقيبة فيها '+bag+' كتاب 🛍️'); }
render(); select(allBooks[0]);
</script>
</body>
</html>
