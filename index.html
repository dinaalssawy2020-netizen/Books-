<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Books - Dina El Sawy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma}
body{background:#000;color:#fff;overflow-x:hidden;padding-bottom:20px}
header{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:32px;letter-spacing:1px}
header h1 span{color:#D4AF37;text-shadow:0 0 20px #D4AF37,0 0 40px #FFD700}
header p{color:#C9A86A;font-size:13px}
.badge{background:#1A1200;border:1px solid #D4AF37;color:#FFD700;padding:6px 12px;border-radius:20px;font-size:12px;box-shadow:0 0 14px rgba(212,175,55,.4)}
.section{margin-top:22px}
.section h2{padding:0 20px;font-size:21px;margin-bottom:12px}
.section h2 span{color:#FFD700;text-shadow:0 0 12px #D4AF37}
.shelf-wrap{position:relative;padding:0 16px}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:16px 4px 24px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.book{flex:0 0 140px;height:200px;border-radius:10px 4px 4px 10px;cursor:grab;color:#fff;padding:12px;position:relative;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s;touch-action:none;border:1px solid #D4AF37;box-shadow:0 0 18px rgba(212,175,55,.25), 6px 8px 0 rgba(0,0,0,.6);background:linear-gradient(135deg,#111,#000)}
.book small{color:#FFD700;font-size:11px;line-height:1.4}
.book b{font-size:15px;line-height:1.3}
.book .price{background:linear-gradient(#FFD700,#D4AF37);color:#000;padding:4px 10px;border-radius:20px;font-size:12px;align-self:flex-start;font-weight:900;box-shadow:0 0 14px #FFD700}
.wood{height:14px;background:linear-gradient(#2A1F00,#0A0800);border:1px solid #D4AF37;border-radius:6px;box-shadow:0 0 16px rgba(212,175,55,.4);margin:-6px 8px 0}
.hand{font-size:38px;text-align:center;margin-top:8px;filter:drop-shadow(0 0 10px #FFD700);animation:hand 1.4s infinite}
@keyframes hand{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(10px) scale(1.1)}}
.detail{position:fixed;left:12px;right:12px;bottom:12px;background:#0A0800;border:1px solid #D4AF37;border-radius:22px;padding:18px;box-shadow:0 0 30px rgba(212,175,55,.4);transform:translateY(120%);transition:.35s;z-index:10}
.detail.show{transform:translateY(0)}
.detail h3{font-size:22px;color:#FFD700}
.detail p{color:#E8D9A8;font-size:13px;line-height:1.6;margin:8px 0}
.opts{display:flex;gap:8px;margin:10px 0}
.opts button{flex:1;padding:10px;border:1px solid #D4AF37;border-radius:12px;background:#000;color:#fff;font-weight:700}
.opts button.active{background:linear-gradient(#FFD700,#D4AF37);color:#000;box-shadow:0 0 16px #FFD700}
.add{width:100%;padding:14px;background:linear-gradient(#FFD700,#D4AF37);color:#000;border:none;border-radius:14px;font-size:16px;font-weight:900;box-shadow:0 0 20px rgba(255,215,0,.5)}
.close{position:absolute;left:14px;top:12px;border:1px solid #D4AF37;background:#000;color:#FFD700;width:30px;height:30px;border-radius:50%}
.bag{position:fixed;bottom:16px;left:16px;background:linear-gradient(#FFD700,#D4AF37);color:#000;padding:10px 16px;border-radius:20px;z-index:20;font-size:13px;font-weight:900;box-shadow:0 0 18px #FFD700}
.footer{text-align:center;padding:30px 20px 20px;margin-top:20px;border-top:1px solid rgba(212,175,55,.4)}
.signature{font-size:38px;font-family:'Brush Script MT',cursive;color:#FFD700;text-shadow:0 0 22px #D4AF37;transform:rotate(-3deg)}
.footer p{color:#C9A86A;font-size:12px;margin-top:8px}
.footer small{color:#8A7A55;font-size:11px}
</style>
</head>
<body>
<div class="bag">🛍️ الحقيبة: <span id="count">0</span></div>
<header><div><h1>Best <span>Books</span></h1><p>مكتبة الوعي والنمو</p></div><div class="badge">نسخة فاخرة</div></header>

<div class="section"><h2>✨ <span>سمية الناصر</span></h2>
<div class="shelf-wrap"><div class="shelf" id="shelf1"></div><div class="wood"></div><div class="hand">👆 اسحبي الكتاب لتحت</div></div></div>

<div class="section"><h2>🔥 <span>الدكتورة سناء زيادة</span></h2>
<div class="shelf-wrap"><div class="shelf" id="shelf2"></div><div class="wood"></div></div></div>

<div class="detail" id="detail">
<button class="close" onclick="hide()">✕</button>
<h3 id="dTitle"></h3><p id="dAuthor"></p><p id="dDesc"></p>
<div class="opts"><button class="active" onclick="setType(this,280)">Paperback - 280 ج</button><button onclick="setType(this,420)">Hardcover - 420 ج</button></div>
<button class="add" onclick="addBag()">Add to bag - <span id="dPrice">280</span> ج</button>
</div>

<div class="footer">
<div class="signature">dinaalssawy ✍️</div>
<p>Best Books © 2026 created by dinaalssawy allrightsreserved</p>
<small>مكتبة الوعي والنمو | سناء زيادة - سمية الناصر</small>
</div>

<script>
const books1=[
{t:"حدثني فقال",a:"سمية الناصر",d:"الكتاب اللي كسر الدنيا. رسائل وعي بتغير طريقة تفكيرك.",p:280},
{t:"كيف تتقن لعبة الحياة",a:"سمية الناصر",d:"369 مشكلة حياتية وحلها. هتفهم لعبة الحياة وتلعبها صح.",p:320},
{t:"حدثني فقال 2",a:"سمية الناصر",d:"الجزء الثاني. تكملة الرحلة، وعي أعمق.",p:300},
{t:"ماذا فعلت؟",a:"سمية الناصر",d:"مجموعة مقالات من حكمة عالمية.",p:250},
{t:"السلام الداخلي",a:"سمية الناصر",d:"ازاي توصل لسلام حقيقي جواك.",p:270},
{t:"لا تقلق",a:"سمية الناصر",d:"90 سر يجعلك تعيش مطمئناً.",p:260},
];
const books2=[
{t:"الشفرة الكاملة لصناعة الثروة",a:"د. سناء زيادة",d:"برنامج عملي لصناعة الثروة من الصفر.",p:450},
{t:"صناعة الواقع",a:"د. سناء زيادة",d:"ازاي تصنع واقعك بنفسك.",p:400},
{t:"بناء الفكر الريادي",a:"د. سناء زيادة",d:"لأي حد عايز يبدأ مشروعه.",p:380},
{t:"تطوير الوعي",a:"د. سناء زيادة",d:"رحلة تطوير الوعي والذات.",p:350},
];
let bag=0;
function render(list,elId){
  const el=document.getElementById(elId);
  list.forEach(b=>{
    const d=document.createElement('div');
    d.className='book';
    d.innerHTML=`<small>${b.a}</small><b>${b.t}</b><span class="price">${b.p} ج</span>`;
    let startY=0, dragging=false;
    d.addEventListener('pointerdown',e=>{startY=e.clientY; dragging=true; d.style.zIndex=5;});
    d.addEventListener('pointermove',e=>{if(!dragging) return; let dy=e.clientY-startY; if(dy>0 && dy<120){ d.style.transform=`translateY(${dy}px) rotate(${dy/6}deg) scale(${1+dy/500})`; d.style.boxShadow=`0 0 30px rgba(255,215,0,.6)`; }});
    d.addEventListener('pointerup',e=>{dragging=false; let dy=e.clientY-startY; d.style.transform=''; d.style.boxShadow=''; d.style.zIndex=''; if(dy>50) openBook(b);});
    d.addEventListener('click',()=>openBook(b));
    el.appendChild(d);
  });
}
function openBook(b){ document.getElementById('dTitle').innerText=b.t; document.getElementById('dAuthor').innerText=b.a; document.getElementById('dDesc').innerText=b.d; document.getElementById('dPrice').innerText=b.p; document.getElementById('detail').classList.add('show'); }
function hide(){document.getElementById('detail').classList.remove('show')}
function setType(btn,price){ document.querySelectorAll('.opts button').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); document.getElementById('dPrice').innerText=price; }
function addBag(){bag++; document.getElementById('count').innerText=bag; alert('تمت الإضافة للحقيبة ✅'); hide();}
render(books1,'shelf1'); render(books2,'shelf2');
</script>
</body>
</html>
